[package]
name = "app-fair"
version = "1.0.2"
edition = "2024"
description = "An open app store for F-Droid-compatible catalogs."
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/reference/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
material = ["day/material"]
winui = ["day/winui"]
arkui = ["day/arkui"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests the iOS staticlib / Android cdylib via
# `cargo rustc --crate-type`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
day = { package = "day-app", version = "0.*", features = ["model"] }
# Settings and About: native settings pages over typed preferences (src/settings.rs).
day-piece-settings = "0.*"
# The on-device catalog: typed models over bundled SQLite, owned by one database worker so
# catalog imports and queries never run on the UI thread (src/catalog.rs).
day-persistence = "0.*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The platform HTTP stack via day (system proxies, VPN, and TLS on macOS/iOS/Android/Windows;
# a bundled ureq + rustls fallback only on Linux/OHOS).
day-part-http = "0.*"
# Verify a downloaded APK against the catalog's SHA-256 before handing it to the installer.
sha2 = "0.10"
# Locale-aware collation for the "Name" sort order. Pure-Rust ICU4X with CLDR data compiled in, so
# ordering is correct for the device locale on every target (one code path, like the bundled SQLite)
# — e.g. Swedish sorts "ä"/"ö" after "z". Bundled SQLite has no ICU collation to defer to.
icu_collator = "2"
icu_locale_core = "2"
# iOS: install through Apple's MarketplaceKit as an alternative app marketplace (src/market.rs).
# A Swift bridge, since MarketplaceKit has no Objective-C surface; off iOS it answers Unsupported.
app-fair-marketplace = { path = "marketplace" }
# Hosts MarketplaceKit's ActionButton in Day pages. A direct dependency so `day build` turns on
# its UIKit renderer for this app.
day-piece-swiftui = "0.*"

# Reach the app's JVM + Context on Android (with_env / dcall_static) for the install bridge.
[target.'cfg(target_os = "android")'.dependencies]
day-platform-android = "0.*"
# Lower background-thread OS priority so the first sync never starves the UI thread.
libc = "0.2"

# App Fair's own Android install bridge (PackageInstaller). Staged into the Gradle build like a
# piece's native half, but it registers no renderer — the Rust cdylib exports the JNI callback.
[package.metadata.day.android]
java = ["android/java"]
# Periodic background update checks (#7) run in a WorkManager worker; the notification they post
# needs POST_NOTIFICATIONS on Android 13+ (INTERNET comes from the toolkit).
gradle-dependencies = ["androidx.work:work-runtime:2.9.1"]
permissions = ["android.permission.POST_NOTIFICATIONS"]
# R8/ProGuard keep rules for the Java classes Rust reaches by name (DayInstaller, UpdateWorker), so
# release minification doesn't rename them out from under JNI. day-build aggregates these.
proguard = ["android/proguard-rules.pro"]

[build-dependencies]
day-build = "0.*"


[workspace]
# The MarketplaceKit bridge the iOS build installs apps through, and the reference signer for the
# install verification tokens App Fair's marketplace server issues (docs/marketplace-server.md).
members = ["marketplace", "marketplace-token"]
