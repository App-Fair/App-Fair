# The Day project manifest (https://daybrite.dev/docs/reference/cli). `name`/`version` come from
# Cargo.toml; any [app] property may be overridden per platform, toolkit, or target.
schema = 1

[app]
id = "org.appfair.AppFair"
title = "App Fair"
build = 4
targets = ["android-material", "ios-uikit"]

# The window's geometry in points (https://daybrite.dev/docs/reference/size-classes): the size a
# desktop-windowing Android window opens at, and how small the system may make it.
[window]
width = 960
height = 640
min_width = 320
min_height = 400

# App Fair is an app store: it hands downloaded packages to the system installer, and it reads
# which apps are installed to offer Install, Update or Launch. Neither is in the portable set
# (https://daybrite.dev/docs/how-to/guide-permissions).
[permissions.raw]
android = [
    "android.permission.REQUEST_INSTALL_PACKAGES",
    "android.permission.QUERY_ALL_PACKAGES",
]

# Native host customization; build projects are generated by Day. The overlay carries App
# Fair's blue Material palette.
[android]
resource-overlays = ["platform/android/res"]

# Release signing. `day pack -t android-material` resolves these `${VAR}` refs at pack time and
# writes the Gradle signingConfig; a missing var degrades to a dev keystore (validate with
# `day sign --check`). Set the vars from the release keystore and its properties:
#   export DAY_ANDROID_KEYSTORE=/abs/path/keystore.jks DAY_ANDROID_KEY_ALIAS=app \
#          DAY_KS_PASS=… DAY_KEY_PASS=…
[signing.android]
keystore = "${DAY_ANDROID_KEYSTORE}"
key-alias = "${DAY_ANDROID_KEY_ALIAS}"
store-pass = "${DAY_KS_PASS}"
key-pass = "${DAY_KEY_PASS}"

# Report which element ids the dayscripts reach: https://daybrite.dev/docs/how-to/dayscript
[dayscript.coverage]
enabled = true

# App extensions, each built as its own target and embedded in the app:
# https://daybrite.dev/docs/how-to/app-extensions
# The MarketplaceKit extension (platform/ios/MarketplaceExtension/): the system calls it, even
# while App Fair is not running, for request headers, failed requests and automatic updates.
# Its Info.plist and MarketplaceExtension.entitlements (the shared App Group) in that folder are
# merged over the preset. MarketplaceAppExtension needs iOS 26; the app itself runs on 17.4.
[[extensions]]
name = "MarketplaceExtension"
kind = "marketplace"
deployment-target = "26.0"
